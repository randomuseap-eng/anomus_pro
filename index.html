<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANOMUS PRO | Hardware & Engineering Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATUCQJiQS0Juo1U86eFj4pjuT_95iTUc",
      authDomain: "anomus-pro.firebaseapp.com",
      projectId: "anomus-pro",
      storageBucket: "anomus-pro.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PERMANENT_OWNER_CODE = "ACESS_OWNER_AP+ADMIN_UniQue";
    let isOwnerLoggedIn = false;

    window.openAuthModal = function() {
      if (isOwnerLoggedIn) {
        isOwnerLoggedIn = false;
        updateRoleUI();
        return;
      }
      document.getElementById('auth-modal').classList.remove('hidden');
      document.getElementById('passcode-input').value = '';
      document.getElementById('auth-error').classList.add('hidden');
    }

    window.closeAuthModal = function() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    window.verifyPasscode = function() {
      const input = document.getElementById('passcode-input').value.trim();
      if (input === PERMANENT_OWNER_CODE) {
        isOwnerLoggedIn = true;
        closeAuthModal();
        updateRoleUI();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    function updateRoleUI() {
      const roleBadge = document.getElementById('role-badge');
      const authBtn = document.getElementById('auth-btn');
      const publishBtn = document.getElementById('publish-btn');

      if (isOwnerLoggedIn) {
        roleBadge.className = "px-3 py-1 rounded-full text-xs font-mono bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 flex items-center gap-1.5";
        roleBadge.innerHTML = '<i class="fa-solid fa-user-check text-cyan-400"></i><span>OWNER MODE</span>';
        authBtn.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i><span>LOGOUT</span>';
        authBtn.className = "px-3 py-1.5 rounded-lg text-xs font-orbitron font-bold bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition-all";
        publishBtn.classList.remove('hidden');
      } else {
        roleBadge.className = "px-3 py-1 rounded-full text-xs font-mono bg-slate-800 text-slate-400 border border-slate-700 flex items-center gap-1.5";
        roleBadge.innerHTML = '<i class="fa-solid fa-user-shield text-slate-400"></i><span>VIEWER MODE</span>';
        authBtn.innerHTML = '<i class="fa-solid fa-lock"></i><span>OWNER LOGIN</span>';
        authBtn.className = "px-4 py-2 rounded-lg text-xs font-orbitron font-bold tracking-wider bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 transition-all flex items-center gap-2";
        publishBtn.classList.add('hidden');
      }
      loadProjects();
    }

    window.openPublishModal = function() {
      if (!isOwnerLoggedIn) return;
      document.getElementById('publish-modal').classList.remove('hidden');
    }

    window.closePublishModal = function() {
      document.getElementById('publish-modal').classList.add('hidden');
      document.getElementById('publish-form').reset();
    }

    window.handlePublish = async function(e) {
      e.preventDefault();
      const title = document.getElementById('build-title').value;
      const category = document.getElementById('build-category').value;
      const description = document.getElementById('build-description').value;
      const pdfUrl = document.getElementById('build-pdf-url').value;

      try {
        await addDoc(collection(db, "projects"), {
          title,
          category,
          description,
          pdfUrl,
          createdAt: Date.now()
        });
        closePublishModal();
      } catch (err) {
        alert("Error publishing project to cloud database.");
      }
    }

    window.deleteProject = async function(id) {
      if (!isOwnerLoggedIn) return;
      if (confirm("Are you sure you want to delete this build?")) {
        try {
          await deleteDoc(doc(db, "projects", id));
        } catch (err) {
          alert("Error deleting project.");
        }
      }
    }

    async function loadProjects() {
      const container = document.getElementById('projects-container');
      const emptyState = document.getElementById('empty-state');

      try {
        const q = query(collection(db, "projects"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
          container.innerHTML = '';
          if (snapshot.empty) {
            container.appendChild(emptyState);
            emptyState.classList.remove('hidden');
            return;
          }
          
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            
            const card = document.createElement('div');
            card.className = "glass-card rounded-2xl p-6 flex flex-col justify-between border border-slate-800 hover:border-cyan-500/40 transition-all";
            card.innerHTML = `
              <div>
                <div class="flex justify-between items-start mb-3">
                  <span class="px-2.5 py-1 rounded-md text-[10px] font-mono font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">${data.category}</span>
                  ${isOwnerLoggedIn ? `
                    <button onclick="deleteProject('${docSnap.id}')" title="Delete Build" class="text-xs text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-2 py-0.5 rounded border border-red-500/30 transition-all">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  ` : ''}
                </div>
                <h3 class="font-orbitron font-bold text-base text-white mb-2">${data.title}</h3>
                <p class="text-xs text-slate-300 mb-6 leading-relaxed">${data.description}</p>
              </div>
              <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between">
                <span class="text-[10px] font-mono text-slate-500">CLOUD SYNCED</span>
                <a href="${data.pdfUrl}" target="_blank" class="px-3 py-1.5 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 border border-cyan-500/40 text-xs font-mono transition-all flex items-center gap-1">
                  <i class="fa-solid fa-file-pdf"></i> VIEW PDF
                </a>
              </div>
            `;
            container.appendChild(card);
          });
        });
      } catch (err) {
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadProjects();
    });
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap');
    body { font-family: 'Rajdhani', sans-serif; background-color: #05070a; color: #e2e8f0; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .glass-card { background: rgba(13, 18, 28, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(6, 182, 212, 0.15); }
    .modal-backdrop { background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- NAVBAR -->
  <header class="border-b border-slate-800 bg-[#070b12]/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="font-orbitron text-lg font-black tracking-wider text-white">ANOMUS<span class="text-cyan-400">.PRO</span></span>
      </div>
      <div class="flex items-center gap-3">
        <div id="role-badge" class="px-3 py-1 rounded-full text-xs font-mono bg-slate-800 text-slate-400 border border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-user-shield"></i><span>VIEWER MODE</span>
        </div>
        <button id="auth-btn" onclick="openAuthModal()" class="px-4 py-2 rounded-lg text-xs font-orbitron font-bold bg-slate-800 text-cyan-400 border border-cyan-500/30">OWNER LOGIN</button>
        <button id="publish-btn" onclick="openPublishModal()" class="hidden px-4 py-2 rounded-lg text-xs font-orbitron font-bold bg-cyan-500 text-slate-950">PUBLISH BUILD</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full">
    <div class="mb-10 text-center max-w-3xl mx-auto">
      <h1 class="font-orbitron text-3xl font-extrabold text-white mb-3">HARDWARE & ROBOTICS <span class="text-cyan-400">BLUEPRINTS</span></h1>
    </div>
    <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div id="empty-state" class="col-span-full glass-card rounded-2xl p-12 text-center border-dashed border-slate-800">
        <h3 class="font-orbitron text-lg font-bold text-white mb-1">NO PUBLISHED BUILDS YET</h3>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-800 bg-[#070b12]/80 backdrop-blur-md py-8">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
      <div class="flex items-center gap-4">
        <!-- ANOMUS PRO LOGO IMAGE -->
        <img src="Anomus Pro.png" alt="ANOMUS PRO Logo" class="h-16 w-auto object-contain rounded-lg border border-cyan-500/30 shadow-lg shadow-cyan-500/10" />
        <div>
          <h4 class="font-orbitron text-sm font-bold text-white">ANOMUS<span class="text-cyan-400">.PRO</span></h4>
          <p class="text-xs font-mono text-slate-500">ANOMUS PRO &copy; 2026. ALL RIGHTS RESERVED.</p>
        </div>
      </div>
      <a href="https://www.youtube.com/@anomuspro" target="_blank" rel="noopener noreferrer" class="px-5 py-2.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs font-orbitron font-bold transition-all flex items-center gap-2.5 shadow-lg shadow-red-500/10">
        <i class="fa-brands fa-youtube text-base"></i> FOLLOW US ON YOUTUBE
      </a>
    </div>
  </footer>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 max-w-md w-full border border-cyan-500/30">
      <h3 class="font-orbitron font-bold text-white text-sm mb-4">OWNER ACCESS VERIFICATION</h3>
      <input type="password" id="passcode-input" placeholder="Enter owner passcode" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-white mb-2 outline-none" />
      <p id="auth-error" class="text-red-400 text-[11px] font-mono hidden mb-3">Invalid passcode.</p>
      <button onclick="verifyPasscode()" class="w-full py-2.5 rounded-lg bg-cyan-500 text-slate-950 font-orbitron font-bold text-xs">VERIFY</button>
    </div>
  </div>

  <!-- PUBLISH MODAL -->
  <div id="publish-modal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 max-w-xl w-full border border-cyan-500/30">
      <h3 class="font-orbitron font-bold text-white text-base mb-6">PUBLISH HARDWARE BUILD</h3>
      <form id="publish-form" onsubmit="handlePublish(event)" class="space-y-4">
        <input type="text" id="build-title" required placeholder="Build Title" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white outline-none" />
        <select id="build-category" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-300 outline-none">
          <option value="ROBOTICS">ROBOTICS</option>
          <option value="CIRCUITRY">CIRCUITRY</option>
          <option value="IOT">IOT HARDWARE</option>
        </select>
        <textarea id="build-description" required rows="3" placeholder="Description..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white outline-none"></textarea>
        <input type="url" id="build-pdf-url" required placeholder="Public PDF Link (e.g., Google Drive share link)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white outline-none" />
        <button type="submit" class="w-full py-2.5 rounded-lg bg-cyan-500 text-slate-950 font-orbitron font-bold text-xs">PUBLISH TO CLOUD</button>
      </form>
    </div>
  </div>

</body>
</html>
